# Integration Quality Scale self-assessment, prepared for the HA core submission.
# Rules: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
# Target: Gold (minimum for Works with Home Assistant), Platinum if feasible.
rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      Registered in async_setup (services.py). Actions raise ServiceValidationError when the
      device is unknown or its entry is not loaded.
  appropriate-polling:
    status: done
    comment: WebSocket push is primary; HTTP polling every 5 minutes is only a fallback.
  brands:
    status: todo
    comment: Only a local brand/ folder; core needs a home-assistant/brands PR with the inkVision icons.
  common-modules:
    status: done
    comment: The coordinator is in coordinator.py, and the shared device_info is in the InkVisionEntity base class in entity.py.
  config-flow:
    status: done
    comment: >-
      User, zeroconf (with a discovery_confirm step) and reconfigure steps; the host field has a
      data_description. The firmware advertises no MAC in its mDNS TXT records, so zeroconf has to
      probe the device over HTTP before it can set the unique ID.
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py covers config_flow.py at 100%.
  dependency-transparency:
    status: todo
    comment: >-
      The device protocol (WebSocket/HTTP client) lives in the integration. Core requires it in a
      separate, open-source library published to PyPI by CI.
  docs-actions:
    status: todo
    comment: Needs the home-assistant.io integration page.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description:
    status: todo
  docs-installation-instructions:
    status: todo
  docs-removal-instructions:
    status: todo
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers; button gestures are event entities.
  entity-event-setup:
    status: done
    comment: The event entity subscribes in async_added_to_hass and unsubscribes via async_on_remove.
  entity-unique-id:
    status: done
    comment: All entities have unique IDs, but they are derived from the config entry ID; prefer the device MAC.
  has-entity-name:
    status: todo
    comment: No entity sets _attr_has_entity_name; names are hard-coded strings.
  runtime-data:
    status: done
    comment: The coordinator is in entry.runtime_data, typed as InkVisionConfigEntry.
  test-before-configure:
    status: done
    comment: validate_input probes /api/info and /status before creating the entry.
  test-before-setup:
    status: done
    comment: async_config_entry_first_refresh raises ConfigEntryNotReady when the device is unreachable.
  unique-config-entry:
    status: done
    comment: The unique ID is the device MAC (falls back to the host when the firmware does not report one).

  # Silver
  action-exceptions:
    status: done
    comment: >-
      Actions and entity commands raise ServiceValidationError for invalid input and
      HomeAssistantError when the device is offline or rejects the command.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: todo
    comment: Document the custom screen templates in the options flow.
  docs-installation-parameters:
    status: todo
  entity-unavailable:
    status: done
    comment: Coordinator entities go unavailable when polling fails; a dropped WebSocket triggers an immediate poll.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: The WebSocket logs one warning per outage; the coordinator logs once on failure and once on recovery.
  parallel-updates:
    status: done
    comment: >-
      0 for the read-only coordinator platforms (sensor, binary_sensor, event). 1 for platforms
      that send commands, so the device gets them one at a time.
  reauthentication-flow:
    status: exempt
    comment: >-
      Devices have no authentication today. Becomes required if the security roadmap adds
      device credentials or tokens.
  test-coverage:
    status: todo
    comment: 93% overall; media_player.py (74%) is the main gap.

  # Gold
  devices:
    status: done
    comment: One device per entry; identifiers fall back to the host when the MAC is missing, so prefer entry.unique_id.
  diagnostics:
    status: todo
  discovery:
    status: done
    comment: Zeroconf (_homebrainz._tcp and name-matched _http._tcp services).
  discovery-update-info:
    status: done
    comment: Rediscovery updates the host of the existing entry.
  docs-data-update:
    status: todo
  docs-examples:
    status: todo
  docs-known-limitations:
    status: todo
  docs-supported-devices:
    status: todo
  docs-supported-functions:
    status: todo
  docs-troubleshooting:
    status: todo
  docs-use-cases:
    status: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry is a single device.
  entity-category:
    status: done
    comment: Diagnostic and config categories are set on firmware, network and button-action entities.
  entity-device-class:
    status: done
    comment: Device classes are set where one exists (CO2, VOC, duration, update, button).
  entity-disabled-by-default:
    status: todo
    comment: Noisy diagnostics (IP, MAC, firmware ID, uptime) should be disabled by default.
  entity-translations:
    status: todo
    comment: Only the button action select uses a translation_key.
  exception-translations:
    status: done
    comment: >-
      Every raised exception, including UpdateFailed, uses a translation key from the exceptions
      section. The audio proxy view has requires_auth = False like core's ESPHome FFmpeg proxy:
      the device can't authenticate, so each URL carries a random 128-bit ID instead.
  icon-translations:
    status: todo
    comment: Icons are set with _attr_icon and in sensor descriptions; move them to icons.json.
  reconfiguration-flow:
    status: done
    comment: The reconfigure step changes the host and aborts when the address belongs to a different device.
  repair-issues:
    status: exempt
    comment: No user-fixable conditions yet; a firmware-too-old issue would be a candidate.
  stale-devices:
    status: exempt
    comment: One device per entry; removing the entry removes the device.

  # Platinum
  async-dependency:
    status: todo
    comment: Depends on the library split; the library must be fully async.
  inject-websession:
    status: todo
    comment: >-
      HTTP already uses HA's shared session, but the WebSocket opens its own connection with the
      websockets package. Switching to aiohttp ws_connect on the injected session drops that dependency.
  strict-typing:
    status: todo
    comment: Many functions lack type hints; the library and integration need to pass mypy --strict.
