# Names and descriptions are in translations/en.json under "services".

set_screen_rotation:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: inkvision
    screens:
      required: true
      selector:
        select:
          multiple: true
          translation_key: screen
          options:
            - clock
            - temp
            - humidity
            - pressure
            - gas
            - iaq

set_custom_screen:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: inkvision
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 4
          step: 1
    text:
      required: false
      selector:
        text:
